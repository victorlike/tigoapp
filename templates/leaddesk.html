<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadDesk Tigo · Agente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg0: #050814; --bg1: #0b1220; --bg2: #0f1a2e;
      --card: rgba(15,27,51,.72); --card-solid: #0d1b33;
      --line: rgba(148,163,184,.18); --muted: #93a4c7;
      --txt: #e2e8f0; --txt-dim: #64748b;
      --accent: #00aef0; --accent-glow: rgba(0,174,240,.25);
      --ok: #34d399; --ok-bg: rgba(52,211,153,.12);
      --warn: #fbbf24; --warn-bg: rgba(251,191,36,.12);
      --danger: #fb7185; --danger-bg: rgba(251,113,133,.12);
      --radius: 14px; --radius-sm: 8px;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Inter',-apple-system,sans-serif;
      background: radial-gradient(1200px 600px at 20% 10%,rgba(0,174,240,.10),transparent 55%),
                  radial-gradient(900px 500px at 90% 20%,rgba(52,211,153,.08),transparent 55%),
                  linear-gradient(180deg,var(--bg0),var(--bg1));
      color:var(--txt); padding:16px; min-height:100vh; height:100vh; overflow:hidden;
    }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:rgba(148,163,184,.06); border-radius:999px; }
    ::-webkit-scrollbar-thumb { background:rgba(148,163,184,.22); border-radius:999px; }
    .app-container { max-width:1320px; margin:0 auto; height:100%; display:grid; grid-template-rows:auto 1fr; gap:14px; }
    .header { display:flex; justify-content:space-between; align-items:center; background:var(--card); backdrop-filter:blur(16px); padding:12px 20px; border-radius:var(--radius); border:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand-icon { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--accent),#0ea5e9); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#fff; box-shadow:0 4px 12px var(--accent-glow); }
    .brand-text { font-size:17px; font-weight:800; letter-spacing:-.5px; }
    .brand-sub { font-size:11px; color:var(--muted); margin-top:1px; }
    .header-right { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .agent-pill { display:flex; align-items:center; gap:6px; background:rgba(148,163,184,.08); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:12px; color:var(--muted); }
    .agent-pill strong { color:var(--txt); font-size:12px; }
    .btn { padding:7px 14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:rgba(148,163,184,.08); color:var(--txt); cursor:pointer; font-size:12px; font-weight:500; font-family:inherit; transition:all .18s; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
    .btn:hover { background:rgba(148,163,184,.16); border-color:rgba(148,163,184,.35); }
    .btn:active { transform:translateY(1px); }
    .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
    .btn-primary { background:linear-gradient(135deg,var(--accent),#0ea5e9); border:none; color:#fff; font-weight:700; box-shadow:0 4px 12px var(--accent-glow); }
    .btn-primary:hover { opacity:.92; transform:translateY(-1px); }
    .btn-primary:disabled { background:rgba(148,163,184,.2); box-shadow:none; transform:none; opacity:.5; }
    .btn-danger { background:var(--danger-bg); border-color:rgba(251,113,133,.3); color:var(--danger); }
    .btn-danger:hover { background:rgba(251,113,133,.22); }
    .btn-ok { background:var(--ok-bg); border-color:rgba(52,211,153,.3); color:var(--ok); }
    .btn-ok:hover { background:rgba(52,211,153,.22); }
    .btn-lg { padding:14px 20px; font-size:14px; font-weight:700; border-radius:12px; justify-content:center; }
    .status-btn { min-width:90px; justify-content:center; gap:7px; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
    .status-btn.active[data-status="ACTIVO"] { background:var(--ok-bg); border-color:rgba(52,211,153,.4); color:var(--ok); }
    .status-btn.active[data-status="ACTIVO"] .status-dot { background:var(--ok); box-shadow:0 0 0 3px rgba(52,211,153,.25); animation:pulse-dot 2s infinite; }
    .status-btn.active[data-status="PAUSA"] { background:var(--warn-bg); border-color:rgba(251,191,36,.4); color:var(--warn); }
    .status-btn.active[data-status="PAUSA"] .status-dot { background:var(--warn); }
    .status-btn.active[data-status="OFFLINE"] { background:var(--danger-bg); border-color:rgba(251,113,133,.4); color:var(--danger); }
    .status-btn.active[data-status="OFFLINE"] .status-dot { background:var(--danger); }
    @keyframes pulse-dot { 0%,100% { box-shadow:0 0 0 0 rgba(52,211,153,.4); } 50% { box-shadow:0 0 0 5px rgba(52,211,153,.0); } }
    .tab-badge { margin-left:5px; padding:1px 6px; border-radius:999px; font-size:10px; background:rgba(148,163,184,.15); color:var(--muted); min-width:20px; text-align:center; }
    .btn.tab-active { background:rgba(0,174,240,.18); border-color:rgba(0,174,240,.4); color:var(--accent); }
    .btn.tab-active .tab-badge { background:rgba(0,174,240,.25); color:#fff; }
    .grid { display:grid; grid-template-columns:300px 1fr; gap:14px; height:100%; overflow:hidden; }
    @media(max-width:900px) { .grid { grid-template-columns:1fr; } }
    .card { background:var(--card); backdrop-filter:blur(12px); padding:16px; border-radius:var(--radius); border:1px solid var(--line); display:flex; flex-direction:column; gap:12px; height:100%; overflow:hidden; }
    .card-head { font-weight:700; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; border-bottom:1px solid var(--line); padding-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
    .stat-row { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); padding:5px 0; border-bottom:1px solid rgba(148,163,184,.06); }
    .stat-row:last-child { border-bottom:none; }
    .stat-val { font-weight:700; color:var(--txt); font-size:14px; }
    .stat-val.red { color:var(--danger); }
    .stat-val.ok { color:var(--ok); }
    .lead-list { overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:8px; padding-right:2px; }
    .lead-item { border:1px solid var(--line); padding:12px 14px; border-radius:12px; background:rgba(15,27,51,.5); display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; font-size:12px; transition:border-color .2s,background .2s; }
    .lead-item:hover { border-color:rgba(0,174,240,.3); background:rgba(0,174,240,.04); }
    .lead-tag { padding:3px 8px; border-radius:6px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
    .tag-asig { background:rgba(0,174,240,.15); color:var(--accent); border:1px solid rgba(0,174,240,.3); }
    .tag-seg { background:rgba(251,191,36,.12); color:var(--warn); border:1px solid rgba(251,191,36,.3); }
    .tag-due { background:var(--danger-bg); color:var(--danger); border:1px solid rgba(251,113,133,.3); }
    .lead-name { font-weight:700; font-size:13px; color:var(--txt); margin-top:3px; }
    .lead-sub { font-size:11px; color:var(--muted); margin-top:2px; }
    .lead-phone { font-weight:600; color:var(--accent); font-size:12px; }
    .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); background:rgba(148,163,184,.07); font-size:11px; color:var(--muted); white-space:nowrap; }
    .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:40px 20px; color:var(--muted); text-align:center; }
    .empty-state svg { opacity:.35; }
    .empty-state p { font-size:13px; }
    .seller-controls { display:flex; flex-direction:column; gap:8px; min-width:220px; }
    .bo-controls { display:flex; flex-direction:column; gap:8px; min-width:220px; }
    select,input[type="text"],input[type="number"],input[type="date"],input[type="datetime-local"],textarea {
      width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-sm);
      font-size:12px; font-family:inherit; background:rgba(15,27,51,.6); color:var(--txt); transition:border-color .2s;
    }
    select:focus,input:focus,textarea:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-glow); }
    select option,option { background-color:#0b1220; color:var(--txt); }
    textarea { resize:vertical; min-height:64px; }
    .modal-overlay { position:fixed; inset:0; background:rgba(5,8,20,.75); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:1000; animation:fadeIn .18s ease; }
    .modal-overlay.open { display:flex; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .modal { background:var(--card-solid); border:1px solid var(--line); width:95%; max-width:1020px; height:92vh; border-radius:18px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 30px 60px rgba(0,0,0,.5); animation:slideUp .2s ease; }
    @keyframes slideUp { from { transform:translateY(16px); opacity:0; } to { transform:translateY(0); opacity:1; } }
    .modal-head { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:rgba(0,174,240,.04); }
    .modal-title { font-size:16px; font-weight:700; color:var(--txt); }
    .modal-subtitle { font-size:12px; color:var(--muted); margin-top:2px; }
    .modal-body { padding:0; flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .modal-split { display:grid; grid-template-columns:45% 55%; min-height:0; flex:1; overflow:hidden; }
    .info-col { padding:20px; border-right:1px solid var(--line); background:rgba(5,8,20,.3); overflow-y:auto; }
    .action-col { padding:20px; background:rgba(15,27,51,.4); display:flex; flex-direction:column; gap:14px; overflow-y:auto; }
    .modal-footer { padding:14px 22px; border-top:1px solid var(--line); background:rgba(5,8,20,.4); }
    .info-group { margin-bottom:16px; }
    .info-title { font-size:10px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.8px; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid rgba(0,174,240,.2); }
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .field-block { margin-bottom:4px; }
    .lbl { font-size:10px; color:var(--muted); display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:.4px; }
    .val { font-size:12px; font-weight:500; color:var(--txt); word-break:break-word; }
    .typification-box { border:1px solid rgba(251,191,36,.25); background:rgba(251,191,36,.05); padding:14px; border-radius:12px; }
    .typification-title { font-size:11px; font-weight:700; color:var(--warn); text-transform:uppercase; letter-spacing:.5px; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
    .tip-steps { display:flex; gap:6px; margin-bottom:12px; align-items:center; }
    .tip-step { width:22px; height:22px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--muted); flex-shrink:0; }
    .tip-step.done { background:var(--accent); border-color:var(--accent); color:#fff; }
    .tip-step-sep { flex:1; height:1px; background:var(--line); }
    .form-row { display:flex; gap:10px; margin-bottom:8px; }
    .form-row > div { flex:1; }
    .sale-container { display:none; margin-top:12px; border-top:1px solid var(--line); padding-top:14px; }
    .subform { background:rgba(0,174,240,.05); border:1px solid rgba(0,174,240,.15); padding:12px; border-radius:10px; margin-bottom:10px; }
    .subform-title { font-size:10px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px; }
    .mini-note { margin-top:6px; border:1px solid var(--line); background:rgba(148,163,184,.05); border-radius:8px; padding:8px 10px; font-size:11px; color:var(--muted); line-height:1.4; }
    .release-modal-overlay { position:fixed; inset:0; background:rgba(5,8,20,.8); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:2000; }
    .release-modal-overlay.open { display:flex; }
    .release-modal { background:var(--card-solid); border:1px solid var(--line); width:92%; max-width:440px; border-radius:16px; padding:24px; box-shadow:0 20px 50px rgba(0,0,0,.5); animation:slideUp .18s ease; }
    .release-modal h3 { font-size:16px; font-weight:700; margin-bottom:6px; }
    .release-modal p { font-size:12px; color:var(--muted); margin-bottom:14px; }
    .toast-wrap { position:fixed; top:20px; right:20px; z-index:3000; display:flex; flex-direction:column; gap:8px; }
    .toast { padding:11px 18px; border-radius:10px; font-size:12px; font-weight:500; font-family:inherit; animation:toastIn .25s ease; box-shadow:0 8px 24px rgba(0,0,0,.3); max-width:340px; }
    .toast.ok { background:var(--ok-bg); border:1px solid rgba(52,211,153,.35); color:var(--ok); }
    .toast.warn { background:var(--warn-bg); border:1px solid rgba(251,191,36,.35); color:var(--warn); }
    .toast.err { background:var(--danger-bg); border:1px solid rgba(251,113,133,.35); color:var(--danger); }
    .toast.info { background:rgba(0,174,240,.1); border:1px solid rgba(0,174,240,.35); color:var(--accent); }
    @keyframes toastIn { from { transform:translateX(24px); opacity:0; } to { transform:translateX(0); opacity:1; } }
    .loader { position:fixed; inset:0; background:rgba(5,8,20,.6); backdrop-filter:blur(3px); display:none; justify-content:center; align-items:center; z-index:4000; }
    .loader.show { display:flex; }
    .spinner { width:44px; height:44px; border:3px solid transparent; border-top-color:var(--accent); border-bottom-color:var(--ok); border-radius:50%; animation:spin 1.2s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .bo-textarea { width:100%; min-height:64px; resize:vertical; }
    .seller-textarea { width:100%; min-height:58px; resize:vertical; }
    .bo-select { width:100%; }
  </style>
</head>
<body>
  <div class="loader" id="loader"><div class="spinner"></div></div>
  <div class="toast-wrap" id="toast-root"></div>

  <!-- RELEASE MODAL -->
  <div class="release-modal-overlay" id="release-modal-overlay">
    <div class="release-modal">
      <h3>Liberar Lead</h3>
      <p id="release-modal-mid-label">El lead volverá a la cola sin agente asignado.</p>
      <div class="field-block" style="margin-bottom:14px;">
        <label class="lbl">Motivo de liberación</label>
        <textarea id="release-reason" rows="2" placeholder="Ej: Terminó turno, llamada caída..."></textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn" onclick="closeReleaseModal_()">Cancelar</button>
        <button class="btn btn-danger" onclick="confirmRelease_()">Liberar</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <!-- HEADER -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon">T</div>
        <div><div class="brand-text">Tigo LeadDesk</div><div class="brand-sub">Vista Agente</div></div>
      </div>
      <div class="header-right">
        <div class="agent-pill">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0112 0v2"/></svg>
          <span>Agente:</span> <strong id="agent-name">...</strong>
        </div>
        <div id="status-btns" style="display:flex;gap:6px;">
          <button class="btn status-btn" data-status="ACTIVO" onclick="setStatus('ACTIVO')"><span class="status-dot"></span><span>Activo</span></button>
          <button class="btn status-btn" data-status="PAUSA" onclick="setStatus('PAUSA')"><span class="status-dot"></span><span>Pausa</span></button>
          <button class="btn status-btn" data-status="OFFLINE" onclick="setStatus('OFFLINE')"><span class="status-dot"></span><span>Offline</span></button>
        </div>
        <button class="btn" onclick="refresh(true)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          Actualizar
        </button>
      </div>
    </div>

    <!-- MAIN GRID -->
    <div class="grid">
      <!-- LEFT PANEL -->
      <div class="card">
        <div class="card-head">Panel de Control</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary btn-lg" id="btn-take" onclick="takeLead()" style="flex:1;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Tomar Lead
          </button>
          <button class="btn btn-lg" onclick="openManualSaleModal()" style="flex:1;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Venta Manual
          </button>
        </div>
        <div>
          <div class="stat-row"><span>Leads en Cola</span><span class="stat-val" id="q-count">—</span></div>
          <div class="stat-row"><span>Mis Pendientes</span><span class="stat-val" id="my-count">—</span></div>
          <div class="stat-row"><span>Fuera de SLA</span><span class="stat-val red" id="sla-count">—</span></div>
          <div class="stat-row"><span>Seguimientos hoy</span><span class="stat-val" id="fu-count">—</span></div>
          <div class="stat-row"><span>Mis Ventas</span><span class="stat-val ok" id="sales-count">—</span></div>
        </div>
      </div>

      <!-- RIGHT PANEL (TABS) -->
      <div class="card">
        <div class="card-head">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn" id="tab-my" onclick="setTab('my')">Mis Leads <span class="tab-badge" id="tab-my-count">0</span></button>
            <button class="btn" id="tab-fu" onclick="setTab('fu')">Seguimientos <span class="tab-badge" id="tab-fu-count">0</span></button>
            <button class="btn" id="tab-sales" onclick="setTab('sales')">Mis Ventas <span class="tab-badge" id="tab-sales-count">0</span></button>
            <button class="btn" id="tab-bo" onclick="setTab('bo')" style="display:none;">Backoffice <span class="tab-badge" id="tab-bo-count">0</span></button>
          </div>
        </div>
        <div class="lead-list" id="tab-my-body"></div>
        <div class="lead-list" id="tab-fu-body" style="display:none;"></div>
        <div class="lead-list" id="tab-sales-body" style="display:none;"></div>
        <div class="lead-list" id="tab-bo-body" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- MODAL PRINCIPAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="modal-title">Gestionar Cliente</div>
          <div class="modal-subtitle" id="modal-lead-subtitle">Cargando datos...</div>
        </div>
        <button class="btn" onclick="closeModal()">✕ Cerrar</button>
      </div>
      <div class="modal-body">
        <div class="modal-split">
          <div class="info-col" id="info-container"></div>
          <div class="action-col">
            <div class="typification-box">
              <div class="typification-title">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 8v4l3 3"/></svg>
                Tipificación Obligatoria
              </div>
              <div class="tip-steps" id="tip-steps-bar">
                <div class="tip-step" id="ts1">1</div><div class="tip-step-sep"></div>
                <div class="tip-step" id="ts2">2</div><div class="tip-step-sep"></div>
                <div class="tip-step" id="ts3">3</div><div class="tip-step-sep"></div>
                <div class="tip-step" id="ts4">4</div>
              </div>
              <div class="form-row">
                <div class="field-block" style="flex:1">
                  <label class="lbl">1. Consulta Inicial</label>
                  <select id="tip-type" onchange="updateResultTypes()"><option value="">- Seleccionar -</option></select>
                </div>
                <div class="field-block" style="flex:1">
                  <label class="lbl">2. Tipo Resultado</label>
                  <select id="tip-result-type" onchange="updateResults()"><option value="">-</option></select>
                </div>
              </div>
              <div class="form-row">
                <div class="field-block" style="flex:1">
                  <label class="lbl">3. Resultado</label>
                  <select id="tip-res" onchange="updateMotives()"><option value="">-</option></select>
                </div>
                <div class="field-block" style="flex:1">
                  <label class="lbl">4. Motivo</label>
                  <select id="tip-motive" onchange="checkSale()"><option value="">-</option></select>
                </div>
              </div>
              <div class="field-block" id="fu-datetime-wrap" style="display:none;">
                <label class="lbl">Hora de Rellamada</label>
                <input type="datetime-local" id="fu-datetime">
              </div>
              <div class="field-block" id="fu-type-wrap" style="display:none;">
                <label class="lbl">Motivo de reagendamiento</label>

    const TYPES = {};
    RAW_TIP.split('\n').forEach(line => {
      let [c1,c2,c3,c4] = (line||'').split('\t');
      if (!c1 || c1.trim()==='ConsultaInicial') return;
      c1=c1.trim(); c2=(c2||'').trim(); c3=(c3||'').trim(); c4=(c4||'').trim();
      if (!TYPES[c1]) TYPES[c1]={};
      if (!TYPES[c1][c2]) TYPES[c1][c2]={};
      if (!TYPES[c1][c2][c3]) TYPES[c1][c2][c3]=[];
      if (c4 && c4!=='-' && !TYPES[c1][c2][c3].includes(c4)) TYPES[c1][c2][c3].push(c4);
    });
    // Asegurar "No contesta" y "Buzón de voz" en todas las consultas
    Object.keys(TYPES).forEach(consulta => {
      ['No contesta','Buzón de voz'].forEach(tRes => {
        if (!TYPES[consulta][tRes]) TYPES[consulta][tRes]={};
        if (!TYPES[consulta][tRes][tRes]) TYPES[consulta][tRes][tRes]=[];
      });
    });

    /* ── STATE ── */
    var app = {
      agent: agentEmail, status: 'OFFLINE',
      myLeads: [], followups: [], mySales: [], backoffice: [],
      current: null, isBO: false,
      boStatusList: ['Pendiente de carga','Pendiente de firma','Pendiente de pago','Enviada a plateran','Pendiente de retiro en pick up','Pendiente de control de documentación','Documentación rechazada','Venta cancelada falta retoma','Venta cancelada finalizada'],
      listas: { planes:[], equipos:[] }
    };
    var currentTab = 'my';
    var _releaseMid = '';
    var _pendingInitialData = false;
    var _pendingFollowups = false;
    var _pendingSales = false;

    /* ── HELPERS ── */
    function esc_(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function _norm_(s) { return String(s||'').trim().toLowerCase(); }
    function cleanPhone_(s) { return String(s||'').replace(/\D/g,''); }
    function safeId_(mid) { return 'x'+String(mid||'').replace(/[^a-zA-Z0-9]/g,'_'); }
    function fmtDate_(v) {
      if (!v) return '-';
      if (typeof v === 'string' && v.length > 10) v = v.substring(0,16).replace('T',' ');
      return v || '-';
    }

    function showToast(msg, type='ok') {
      const w = document.getElementById('toast-root');
      const d = document.createElement('div');
      d.className = 'toast ' + type;
      d.textContent = msg;
      w.appendChild(d);
      setTimeout(() => d.remove(), 4000);
    }

    function copyText_(txt) {
      txt = String(txt||'').trim();
      if (!txt || txt==='-') return;
      navigator.clipboard.writeText(txt).catch(()=>{});
      showToast('Copiado: ' + txt, 'info');
    }

    function copyFromBtn_(btn) { copyText_(btn.dataset.phone || ''); }

    /* ── RELEASE MODAL ── */
    function openReleaseModal_(mid) {
      _releaseMid = mid;
      document.getElementById('release-modal-mid-label').textContent = 'Lead ' + mid + ' volverá a la cola sin agente.';
      document.getElementById('release-reason').value = '';
      document.getElementById('release-modal-overlay').classList.add('open');
    }
    function closeReleaseModal_() { document.getElementById('release-modal-overlay').classList.remove('open'); }
    function confirmRelease_() {
      const motivo = document.getElementById('release-reason').value.trim() || 'Sin motivo';
      closeReleaseModal_();
      fetch(`${BASE}/api/leads/${encodeURIComponent(_releaseMid)}/release?email=${encodeURIComponent(app.agent)}`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({motivo})
      }).then(r=>r.json()).then(res=>{
        if (res.success) { showToast('Lead liberado','ok'); refresh(true); }
        else showToast(res.detail||res.message||'Error al liberar','err');
      }).catch(()=>showToast('Error al liberar','err'));
    }

    /* ── API CALLS ── */
    async function api(url, opts) {
      const r = await fetch(BASE+url, opts||{});
      return r.json();
    }

    /* ── INIT / REFRESH ── */
    function init() {
      const s = document.getElementById('tip-type');
      Object.keys(TYPES).sort().forEach(k=>s.add(new Option(k,k)));
      setTab('my');
      let isFirst = !sessionStorage.getItem('ld_init');
      if (isFirst) sessionStorage.setItem('ld_init','1');
      refresh(true, isFirst);
      setInterval(softRefresh, 15000);
      document.getElementById('fu-type').addEventListener('change', checkSale);
    }

    function refresh(force, isLogin) {
      document.getElementById('loader').style.display = 'flex';
      fetchInitialData_(isLogin);
      if (currentTab==='fu') fetchFollowups_();
      if (currentTab==='sales') fetchSales_();
    }

    function softRefresh() {
      const modalOpen = document.getElementById('modal').classList.contains('open');
      if (modalOpen) return;
      fetchInitialData_();
      if (currentTab==='fu') fetchFollowups_();
      if (currentTab==='sales') fetchSales_();
    }

    function fetchInitialData_(isLogin) {
      if (_pendingInitialData) return;
      _pendingInitialData = true;
      const loginParam = isLogin ? '&login=true' : '';
      fetch(`${BASE}/api/agent/init?email=${encodeURIComponent(app.agent)}${loginParam}`)
        .then(r=>r.json())
        .then(res => { _pendingInitialData=false; document.getElementById('loader').style.display='none'; onLoad(res); })
        .catch(err => { _pendingInitialData=false; document.getElementById('loader').style.display='none'; showToast('Error de conexión','err'); });
    }

    function fetchFollowups_() {
      if (_pendingFollowups) return;
      _pendingFollowups = true;
      fetch(`${BASE}/api/followups?email=${encodeURIComponent(app.agent)}`)
        .then(r=>r.json())
        .then(res => { _pendingFollowups=false; onLoadFollowups(res); })
        .catch(()=>{ _pendingFollowups=false; });
    }

    function fetchSales_() {
      if (_pendingSales) return;
      _pendingSales = true;
      fetch(`${BASE}/api/seller/sales?email=${encodeURIComponent(app.agent)}`)
        .then(r=>r.json())
        .then(res => { _pendingSales=false; onLoadSales(res); })
        .catch(()=>{ _pendingSales=false; });
    }

    function onLoad(res) {
      if (!res || !res.success) return;
      app.agent = res.agentEmail || app.agent;
      app.status = res.agentStatus || 'OFFLINE';
      app.myLeads = res.myLeads || [];
      app.isBO = !!res.isBO;
      app.boStatusList = (res.boStatusList && res.boStatusList.length) ? res.boStatusList : app.boStatusList;
      const catalog = res.catalog || [];
      app.listas.planes = catalog.filter(c=>c.item_type==='PLAN').map(c=>c.name);
      app.listas.equipos = catalog.filter(c=>c.item_type==='EQUIPO').map(c=>c.name);

      document.getElementById('agent-name').innerText = app.agent;
      document.getElementById('q-count').innerText = res.queueCount || 0;
      document.getElementById('my-count').innerText = app.myLeads.length;
      document.getElementById('sla-count').innerText = res.slaBreachedCount || 0;
      document.getElementById('tab-my-count').textContent = app.myLeads.length;
      document.getElementById('btn-take').disabled = (app.status !== 'ACTIVO' || app.myLeads.length > 0);

      document.querySelectorAll('#status-btns .status-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.status === app.status);
      });
      document.getElementById('tab-bo').style.display = app.isBO ? 'inline-flex' : 'none';
      if (currentTab === 'my') renderMyLeads();
    }

    function onLoadFollowups(res) {
      app.followups = (res && res.success) ? (res.items || []) : [];
      document.getElementById('fu-count').innerText = app.followups.length;
      document.getElementById('tab-fu-count').textContent = app.followups.length;
      // Notificar seguimientos vencidos
      const due = app.followups.find(x=>x.due_now);
      if (due) showToast('🔔 Rellamada lista: ' + (due.nombre||due.linea||''), 'warn');
      if (currentTab==='fu') renderFollowups();
    }

    function onLoadSales(res) {
      app.mySales = (res && res.success) ? (res.items || []) : [];
      document.getElementById('sales-count').innerText = app.mySales.length;
      document.getElementById('tab-sales-count').textContent = app.mySales.length;
      if (currentTab==='sales') renderMySales();
    }

    /* ── TABS ── */
    function setTab(t) {
      if (t==='bo' && !app.isBO) { showToast('Sin acceso a Backoffice','warn'); t='sales'; }
      currentTab = t;
      ['my','fu','sales','bo'].forEach(id => {
        document.getElementById('tab-'+id+'-body').style.display = (id===t ? 'flex':'none');
        const btn = document.getElementById('tab-'+id);
        if (btn) btn.classList.toggle('tab-active', id===t);
      });
      if (t==='fu') { fetchFollowups_(); }
      if (t==='sales') { fetchSales_(); }
      if (t==='bo' && !app.backoffice.length) { fetchBackoffice_(); }
    }

    function fetchBackoffice_() {
      fetch(`${BASE}/api/sales/backoffice`)
        .then(r=>r.json())
        .then(res => {
          app.backoffice = (res && res.success) ? (res.items||[]) : [];
          document.getElementById('tab-bo-count').textContent = app.backoffice.length;
          renderBackoffice();
        });
    }

    /* ── RENDER LISTAS ── */
    function renderMyLeads() {
      const c = document.getElementById('tab-my-body');
      c.innerHTML = '';
      if (!app.myLeads.length) {
        c.innerHTML = `<div class="empty-state"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><p>No tienes leads asignados.<br>Presioná <strong>Tomar Lead</strong> cuando estés listo.</p></div>`;
        return;
      }
      app.myLeads.forEach(l => {
        const mid = l.message_id || l.messageId || '';
        const phone = cleanPhone_(l.linea);
        c.innerHTML += `
        <div class="lead-item">
          <div>
            <div class="lead-tag tag-asig">${esc_(l.estado||'ASIGNADO')}</div>
            <div class="lead-name">${esc_(l.nombre||'(sin nombre)')}</div>
          </div>
          <div>
            <div class="lead-phone">&#128222; ${esc_(l.linea||'-')}</div>
            <div class="lead-sub">Plan: ${esc_(l.plan||'-')} · Equipo: ${esc_(l.equipo||'-')}</div>
            <div class="lead-sub">Origen: ${esc_(l.origen||'-')} · ${esc_(fmtDate_(l.fecha_asignacion))}</div>
            <button class="btn" style="margin-top:4px;font-size:11px;" data-phone="${phone}" onclick="copyFromBtn_(this)">📋 Copiar tel.</button>
          </div>
          <div style="display:flex;gap:6px;flex-direction:column;align-items:flex-end;">
            <button class="btn btn-primary" style="font-size:12px;" onclick="openModal('${esc_(mid)}')">Gestionar</button>
            <button class="btn btn-danger" style="font-size:11px;" onclick="openReleaseModal_('${esc_(mid)}')">Liberar</button>
          </div>
        </div>`;
      });
    }

    function renderFollowups() {
      const c = document.getElementById('tab-fu-body');
      c.innerHTML = '';
      if (!app.followups.length) {
        c.innerHTML = `<div class="empty-state"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><p>No hay seguimientos programados.</p></div>`;
        return;
      }
      app.followups.forEach(l => {
        const mid = l.message_id || '';
        const rt = (l.reagendar_tipo||'').toUpperCase();
        const isDue = !!l.due_now;
        const tagRt = rt ? ` · ${rt}${rt==='NO_CONTACTO'?' ('+((l.nocontacto_intentos||0))+'/3)':''}` : '';
        c.innerHTML += `

    /* ── MODAL: ABRIR / CERRAR ── */
    function openModal(mid) {
      document.getElementById('loader').style.display = 'flex';
      fetch(`${BASE}/api/leads/${encodeURIComponent(mid)}`)
        .then(r=>r.json())
        .then(res => {
          document.getElementById('loader').style.display = 'none';
          const l = res.lead || res.sale;
          if (!l) { showToast('Lead no encontrado','err'); return; }
          app.current = l;
          renderModalInfo(l);
          resetTypification_();
          document.getElementById('modal').classList.add('open');
          document.getElementById('modal-lead-subtitle').textContent = (l.nombre||l.linea||mid) + ' · ' + (l.estado||'');
          // Check phone duplicates
          if (l.linea) {
            fetch(`${BASE}/api/leads/dup_check?phone=${encodeURIComponent(l.linea)}&message_id=${encodeURIComponent(mid)}`)
              .then(r=>r.json()).then(d => {
                if (d.today > 0) showToast(`⚠️ Teléfono repetido ${d.today}x hoy`,'warn');
              });
          }
        })
        .catch(()=>{ document.getElementById('loader').style.display='none'; showToast('Error al cargar lead','err'); });
    }

    /* ── TIPIFICACIÓN ── */
    function resetTypification_() {
      ['tip-type','tip-result-type','tip-res','tip-motive'].forEach(id=>document.getElementById(id).value='');
      updateResultTypes();
      document.getElementById('sale-container').style.display='none';
      document.getElementById('fu-datetime-wrap').style.display='none';
      document.getElementById('fu-type-wrap').style.display='none';
      document.getElementById('fu-attempt-hint').style.display='none';
      document.getElementById('notes').value='';
      document.getElementById('dynamic-form').innerHTML='';
      document.getElementById('sale-form-selector').value='';
      document.getElementById('seller-comment').value=(app.current&&app.current.vendedor_comentarios)||'';
    }

    function updateResultTypes() {
      const t = document.getElementById('tip-type').value;
      const s = document.getElementById('tip-result-type');
      s.innerHTML = '<option value="">-</option>';
      if (t && TYPES[t]) Object.keys(TYPES[t]).sort().forEach(k=>s.add(new Option(k,k)));
      updateResults();
      updateStepBar_();
    }

    function updateResults() {
      const t=document.getElementById('tip-type').value;
      const r=document.getElementById('tip-result-type').value;
      const s=document.getElementById('tip-res');
      s.innerHTML='<option value="">-</option>';
      if (t&&r&&TYPES[t]&&TYPES[t][r]) Object.keys(TYPES[t][r]).sort().forEach(k=>s.add(new Option(k,k)));
      updateMotives();
      updateStepBar_();
    }

    function updateMotives() {
      const t=document.getElementById('tip-type').value;
      const r=document.getElementById('tip-result-type').value;
      const c=document.getElementById('tip-res').value;
      const s=document.getElementById('tip-motive');
      s.innerHTML='<option value="">-</option>';
      if (t&&r&&c&&TYPES[t]&&TYPES[t][r]&&TYPES[t][r][c]) TYPES[t][r][c].forEach(m=>s.add(new Option(m,m)));
      checkSale();
      updateStepBar_();
    }

    function updateStepBar_() {
      const v=[document.getElementById('tip-type').value,document.getElementById('tip-result-type').value,document.getElementById('tip-res').value,document.getElementById('tip-motive').value];
      [1,2,3,4].forEach(i=>document.getElementById('ts'+i).classList.toggle('done',!!v[i-1]));
    }

    function checkSale() {
      const tr=_norm_(document.getElementById('tip-result-type').value);
      const r=_norm_(document.getElementById('tip-res').value);
      const isSale=(tr==='venta'||r==='venta');
      const isRellamado=(tr==='rellamado');

      document.getElementById('sale-container').style.display=isSale?'block':'none';
      document.getElementById('fu-datetime-wrap').style.display=isRellamado?'block':'none';
      document.getElementById('fu-type-wrap').style.display=isRellamado?'block':'none';

      // Mostrar contador NO_CONTACTO
      if (isRellamado && app.current) {
        const ft=document.getElementById('fu-type').value;
        const hint=document.getElementById('fu-attempt-hint');
        if (ft==='NO_CONTACTO') {
          const intentos=parseInt(app.current.nocontacto_intentos||0);
          hint.textContent=`Intento ${intentos+1}/3 de NO CONTACTO.`;
          hint.style.display='block';
        } else {
          hint.style.display='none';
        }
      }
      updateStepBar_();
    }

    /* ── GUARDAR GESTIÓN ── */
    function save() {
      const tip=document.getElementById('tip-type').value;
      const tr=document.getElementById('tip-result-type').value;
      const res=document.getElementById('tip-res').value;
      const mot=document.getElementById('tip-motive').value;
      if (!tip||!tr||!res) { showToast('Completá la tipificación (Tipo, Resultado y Sub-resultado)','err'); return; }

      const notes=document.getElementById('notes').value;
      const isRellamado=_norm_(tr)==='rellamado';
      const isSale=(_norm_(tr)==='venta'||_norm_(res)==='venta');

      let saleData = null;
      let fuWhen = null;
      let fuType = null;

      if (isRellamado) {
        fuWhen=document.getElementById('fu-datetime').value;
        fuType=document.getElementById('fu-type').value;
        if (!fuWhen) { showToast('Seleccioná fecha/hora de rellamada','err'); return; }
        const intentos=parseInt((app.current&&app.current.nocontacto_intentos)||0);
        if (fuType==='NO_CONTACTO' && intentos>=3) { showToast('Límite de 3 intentos NO CONTACTO alcanzado. Cerrá como No Venta.','err'); return; }
      }

      if (isSale) {
        const formType=document.getElementById('sale-form-selector').value;
        if (!formType) { showToast('Seleccioná el tipo de venta','err'); return; }
        saleData = { Producto:formType, VendedorComentarios:document.getElementById('seller-comment').value };
        const inputs=document.querySelectorAll('#dynamic-form [id^="f-"]');
        let missing=[];
        inputs.forEach(i=>{
          const key=i.id.replace('f-','');
          saleData[key]=i.value;
          if (i.dataset.required==='true'&&!i.value) {
            missing.push(i.closest('.subform')?.querySelector('.lbl')?.textContent||key);
          }
        });
        if (missing.length) { showToast('Faltan: '+missing.join(', '),'err'); return; }
      }

      const mid=app.current&&app.current.message_id;
      if (!mid) { showToast('Error: sin ID de lead','err'); return; }

      const finalEstado = isSale ? 'Venta' : isRellamado ? 'SEGUIMIENTO' : 'CERRADO';

      document.getElementById('loader').style.display='flex';
      fetch(`${BASE}/api/leads/${encodeURIComponent(mid)}/status`, {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          estado: finalEstado,
          resultado: isSale?'Venta':isRellamado?'Seguimiento':'No Venta',
          tip_tipo: tip, tip_resultado: tr, tip_motivo: res, tip_submotivo: mot,
          rellamar_en: fuWhen||null, reagendar_tipo: fuType||null,
          nocontacto_intentos: isRellamado&&fuType==='NO_CONTACTO' ? ((parseInt(app.current.nocontacto_intentos||0))+1) : null,
          sale_data: saleData
        })
      }).then(r=>r.json()).then(res=>{
        document.getElementById('loader').style.display='none';
        if (res.success||res.detail===undefined) {
          showToast(isSale?'¡Venta registrada!':'Gestión guardada','ok');
          closeModal(); refresh(true);
        } else {
          showToast(res.detail||res.message||'Error al guardar','err');
        }
      }).catch(()=>{ document.getElementById('loader').style.display='none'; showToast('Error de red','err'); });
    }

    /* ── ACCIONES ── */
    function takeLead() {
      document.getElementById('loader').style.display='flex';
      fetch(`${BASE}/api/agent/take?email=${encodeURIComponent(app.agent)}`,{method:'POST'})
        .then(r=>r.json()).then(res=>{
          document.getElementById('loader').style.display='none';
          if (res.success) { showToast('Lead asignado','ok'); refresh(true); }
          else showToast(res.message||res.detail||'Sin leads en cola','warn');
        }).catch(()=>{ document.getElementById('loader').style.display='none'; showToast('Error','err'); });
    }

    function takeFollowup(mid) {
      fetch(`${BASE}/api/followups/take?message_id=${encodeURIComponent(mid)}&email=${encodeURIComponent(app.agent)}`,{method:'POST'})
        .then(r=>r.json()).then(res=>{
          if (res.success) { showToast('Seguimiento tomado','ok'); refresh(true); }
          else showToast(res.detail||'Error','err');
        });
    }

    function setStatus(s) {
      document.getElementById('loader').style.display='flex';
      fetch(`${BASE}/api/agent/status?email=${encodeURIComponent(app.agent)}`,{
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({estado:s})
      }).then(r=>r.json()).then(res=>{
        document.getElementById('loader').style.display='none';
        if (res.success||res.estado) {
          app.status=s;
          document.querySelectorAll('#status-btns .status-btn').forEach(b=>b.classList.toggle('active',b.dataset.status===s));
          showToast('Estado: '+s,'ok');
          if (s==='ACTIVO') refresh(true);
        } else {
          showToast(res.detail||res.error||'Error cambiando estado','err');
        }
      }).catch(()=>{ document.getElementById('loader').style.display='none'; showToast('Error','err'); });
    }

      const txt = document.getElementById('sn-'+sid)?.value||'';

        method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({comentario:txt})
      }).then(r=>r.json()).then(res=>{

        else showToast(res.detail||'Error','err');

        body: JSON.stringify({backoffice_status:st, backoffice_notas:notas, backoffice_agent:app.agent})

    function renderSaleForm(type) {
